# Release: run it by hand from the Actions tab and type a version like 1.2.0.
# It tests, bumps package.json, rebuilds dist/, commits, creates the tag v1.2.0 and moves the
# floating tag v1 to the same commit, so users who write `uses: pachara-n/bombgrid@v1` get the update.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (example: 1.2.0)"
        required: true
        type: string

# needs to push a commit and tags
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must look like 1.2.0 (got '$VERSION')"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Bump version and rebuild the bundle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version
          npm run build
      - name: Commit, tag and push
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          MAJOR="${VERSION%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json dist/index.js
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"
          # the floating major tag always points at the newest release of that major version
          git tag -f "v$MAJOR"
          git push origin HEAD
          git push origin "v$VERSION"
          git push -f origin "v$MAJOR"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
